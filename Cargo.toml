[workspace]
resolver = "2"
members = [
    "crates/rad-api",
    "crates/rad-vault",
    "crates/rad-ingest",
    "crates/rad-llm",
    "crates/rad-local",
    "crates/rad-server",
    "crates/rad-tunnel",
    "crates/rad-db",
    "crates/rad-zx",
    "crates/rad-c64",
    "app/src-tauri",
]
# The web browser engines, the media engine (libVLC), Rymnet and SideX (a checkout made by
# scripts/build-sidex.sh) are their own workspaces: see browser/rad-browser,
# browser/rad-chromium, media/rad-media, rymnet and sidex.
exclude = ["browser", "media", "rymnet", "sidex"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Robert <robert@rymtechsystems.com>"]

[workspace.dependencies]
rad-api = { path = "crates/rad-api" }
rad-vault = { path = "crates/rad-vault" }
rad-ingest = { path = "crates/rad-ingest" }
rad-llm = { path = "crates/rad-llm" }
rad-local = { path = "crates/rad-local" }
rad-tunnel = { path = "crates/rad-tunnel" }
rad-db = { path = "crates/rad-db" }
rad-zx = { path = "crates/rad-zx" }
rad-c64 = { path = "crates/rad-c64" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
base64 = "0.22"
blake3 = "1"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2

# The ZX Spectrum emulator must run at full speed even in development builds.
[profile.dev.package.rad-zx]
opt-level = 3
[profile.dev.package.spectrusty]
opt-level = 3
[profile.dev.package.spectrusty-core]
opt-level = 3
[profile.dev.package.spectrusty-peripherals]
opt-level = 3
[profile.dev.package.spectrusty-audio]
opt-level = 3
[profile.dev.package.z80emu]
opt-level = 3
# …and the C64's.
[profile.dev.package.rad-c64]
opt-level = 3
