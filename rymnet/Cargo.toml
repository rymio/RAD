[workspace]
members = [
    "crates/rymnet-core",
    "crates/rymnet-storage",
    "crates/rymnet-domain",
    "crates/rymnet-account",
    "crates/rymnet-mail",
    "crates/rymnet-chat",
    "crates/rymnet-board",
    "crates/rymnet-site",
    "crates/rymnet-search",
    "crates/rymnet-network",
    "crates/rymnet-gateway",
    "crates/rymnetd",
    "crates/rym",
    "crates/rymsh",
    "crates/rymnet-web",
    "crates/rymwin",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
argon2 = "0.5.3"
axum = "0.8.6"
base64 = "0.22.1"
blake3 = "1.8.2"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.50", features = ["derive"] }
crossterm = "0.28.1"
eframe = "0.35.0"
egui-wgpu = "0.35.0"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
egui = "0.35.0"
egui_commonmark = "0.24.0"
egui_extras = { version = "0.35.0", default-features = false, features = ["file", "image"] }
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
mime_guess = "2.0.5"
pdfium-render = { version = "0.9.2", default-features = false, features = ["pdfium_latest"] }
pulldown-cmark = "0.13.4"
rand = "0.8.5"
rustpython-stdlib = { version = "0.5.0", default-features = false, features = ["compiler"] }
rustpython-vm = "0.5.0"
rustyline = "14.0.0"
scraper = "0.24.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shell-words = "1.1.0"
snow = "0.9.6"
tantivy = "0.22.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "process", "sync"] }
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
walkdir = "2.5.0"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

rymnet-core = { path = "crates/rymnet-core" }
rymnet-domain = { path = "crates/rymnet-domain" }
rymnet-account = { path = "crates/rymnet-account" }
rymnet-mail = { path = "crates/rymnet-mail" }
rymnet-chat = { path = "crates/rymnet-chat" }
rymnet-board = { path = "crates/rymnet-board" }
rymnet-storage = { path = "crates/rymnet-storage" }
rymnet-site = { path = "crates/rymnet-site" }
rymnet-search = { path = "crates/rymnet-search" }
rymnet-network = { path = "crates/rymnet-network" }
rymnet-gateway = { path = "crates/rymnet-gateway" }
