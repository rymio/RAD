# Reverse proxy for rymweb, for use with nginx + certbot instead of Caddy.
# Install: sudo certbot --nginx -d rymtech.net   (after this file is in place
# and nginx has reloaded once over plain HTTP; certbot rewrites this file in
# place to add the TLS server block and the :80 -> :443 redirect)

server {
    listen 80;
    listen [::]:80;
    server_name rymtech.net;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # rymweb sessions are cookie-based; nothing here needs WebSocket
        # upgrade headers since /api/exec is plain request/response.
    }
}
