# RAD server — nginx reverse proxy with HTTPS
# Install: see config/README.md
#   sudo cp config/nginx/rad.conf /etc/nginx/sites-available/rad.conf
#   sudo ln -s /etc/nginx/sites-available/rad.conf /etc/nginx/sites-enabled/
#   Replace every "rad.example.com" with your domain, then: sudo nginx -t && sudo systemctl reload nginx

upstream rad_server {
    server 127.0.0.1:8765;
    keepalive 16;
}

# HTTP: ACME challenges for Let's Encrypt, everything else → HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name rad.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rad.example.com;

    # --- TLS (certbot certonly --webroot -w /var/www/letsencrypt -d rad.example.com)
    ssl_certificate     /etc/letsencrypt/live/rad.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rad.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:RAD_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Optional: only allow your own networks (LAN, Tailscale). Uncomment and adjust.
    # allow 192.168.0.0/16;
    # allow 100.64.0.0/10;   # Tailscale
    # deny all;

    # --- uploads: big files, streamed straight through to the vault
    client_max_body_size 8g;          # keep in sync with RAD_MAX_UPLOAD_MB
    proxy_request_buffering off;      # don't spool uploads to nginx temp files (they'd be plaintext)

    # --- responses: never cache decrypted content on disk, stream immediately
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_cache off;

    # Brute-force protection on unlock/pairing (rad-server also rate-limits).
    location ~ ^/v1/(unlock|pair|vault/init) {
        limit_req zone=rad_auth burst=5 nodelay;
        proxy_pass http://rad_server;
        include /etc/nginx/snippets/rad-proxy.conf;
    }

    # Chat answers and live sync are Server-Sent Events: no buffering, long timeouts, no gzip.
    location ~ ^/v1/(events|chats/\d+/messages|providers/\d+/pull)$ {
        proxy_pass http://rad_server;
        include /etc/nginx/snippets/rad-proxy.conf;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://rad_server;
        include /etc/nginx/snippets/rad-proxy.conf;
        proxy_read_timeout 15m;       # large uploads / long indexing calls
        proxy_send_timeout 15m;
    }
}
