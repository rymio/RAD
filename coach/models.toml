# Pinned model manifest for Aussie Accent Coach.
#
# sha256 = "" means trust-on-first-use: the first complete download's hash is
# recorded beside the file and enforced afterwards. Before a release, download each
# model once, run `shasum -a 256 <file>`, and paste the hash here.
#
# URLs were written without network access to Hugging Face; confirm each resolves
# (`curl -sIL <url> | head -1`) the first time you run the downloader.

version = 1

[[model]]
id = "coach-qwen2.5-7b"
name = "Qwen2.5 7B Instruct (Q4_K_M)"
role = "coach"
url = "https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf"
file = "Qwen2.5-7B-Instruct-Q4_K_M.gguf"
sha256 = ""
size_mb = 4680
milestone = "M4"
default = true

