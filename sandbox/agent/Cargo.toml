[package]
name = "rad-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "RAD's agent inside a container VM: runs programs and serves files over vsock"

# Built for the guest (aarch64-unknown-linux-musl) by scripts/build-sandbox.sh — not part of
# RAD's workspace.
[workspace]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
