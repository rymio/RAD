[package]
name = "rad-chess"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "RAD's chess engine process: RustChess (alpha-beta search and opening book) behind a JSON request"
publish = false

# Its own workspace: the engine is fetched at build time (scripts/build-chess.sh), not vendored.
# RustChess (https://github.com/codyjk/RustChess) carries no licence file; it is linked here, never copied.
[workspace]

[dependencies]
chess = { git = "https://github.com/codyjk/RustChess", rev = "d4d09d4ede162b24d9e255201574d0b3f0fc95f8" }
common = { git = "https://github.com/codyjk/RustChess", rev = "d4d09d4ede162b24d9e255201574d0b3f0fc95f8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
