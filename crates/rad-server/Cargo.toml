[package]
name = "rad-server"
version.workspace = true
edition.workspace = true
description = "RAD server: owns the encrypted vault and serves RAD desktop clients"

[lib]
name = "rad_server"
path = "src/lib.rs"

[[bin]]
name = "rad-server"
path = "src/main.rs"

[dependencies]
rad-api.workspace = true
rad-vault.workspace = true
rad-ingest.workspace = true
rad-llm.workspace = true
rad-local.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
blake3.workspace = true
rand.workspace = true
chrono.workspace = true
hex = "0.4"
axum = { version = "0.8", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tokio-stream = { version = "0.1", features = ["sync"] }
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
percent-encoding = "2"
zeroize = "1"

[dev-dependencies]
reqwest = { workspace = true }
serde_json.workspace = true
tempfile = "3"
