[package]
name = "rad-db"
version.workspace = true
edition.workspace = true
description = "RAD databases: user SQL databases (Turso engine), encrypted, next to the vault"

[dependencies]
# Turso: an in-process SQLite-compatible engine in Rust (https://github.com/tursodatabase/turso).
# No default features: its mimalloc global allocator isn't RAD's to choose.
turso = { version = "0.9.0-pre.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64.workspace = true
rand.workspace = true
hex = "0.4"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
