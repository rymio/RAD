[package]
name = "rad-local"
version.workspace = true
edition.workspace = true
description = "RAD's built-in llama.cpp engine and local GGUF model library"

[dependencies]
# llama.cpp is compiled in (needs cmake + a C/C++ toolchain + libclang). Metal is on by default on macOS.
llama-cpp-2 = { version = "0.1.159", default-features = false }
reqwest.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
thiserror.workspace = true

sha2 = "0.10"
hex = "0.4"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
