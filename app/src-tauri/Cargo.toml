[package]
name = "rad-app"
version.workspace = true
edition.workspace = true
description = "RAD — personal RAG assistant (desktop client)"

[lib]
name = "rad_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rad-tunnel.workspace = true
rad-api.workspace = true
rad-zx.workspace = true
rad-server = { path = "../../crates/rad-server" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
reqwest.workspace = true
blake3.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
percent-encoding = "2"
arboard = { version = "3", features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
xcap = "0.9"
window-vibrancy = "0.6"
hostname = "0.4"
zeroize = "1"
portable-pty = "0.9"
sha2 = "0.10"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
mail-parser = "0.11"
getrandom = "0.2"
# Sound for the ZX Spectrum view.
cpal = "0.18"

[dev-dependencies]
tempfile = "3"
